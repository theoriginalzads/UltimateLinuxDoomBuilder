# ULDB: build and test the Linux port (Builder.Linux.sln) on every push and pull request.
# Upstream's own workflows (build_*.yml, continuous_integration.yml) are left unchanged.
name: ULDB CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: uldb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      # Tests that need an IWAD look here first (OpenSaveMapTests.FindFreedoom2).
      ULDB_TEST_IWAD: /usr/share/games/doom/freedoom2.wad
      # OffscreenGL uses Mesa's surfaceless EGL platform with the llvmpipe software renderer.
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out (with compiler submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 cmake ninja-build build-essential \
            libx11-dev libxfixes-dev libgl-dev libegl-dev zlib1g-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri \
            freedoom

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Builder.Linux.sln

      - name: Test
        run: dotnet test Builder.Linux.sln --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uldb-test-results
          path: TestResults/
          if-no-files-found: ignore
