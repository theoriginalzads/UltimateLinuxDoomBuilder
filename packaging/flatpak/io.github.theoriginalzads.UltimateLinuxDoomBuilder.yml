# Flatpak manifest for Ultimate Linux Doom Builder.
#
# UNTESTED: this has not been built with flatpak-builder yet. See packaging/README.md.
#
# Before the first build, generate nuget-sources.json next to this file (offline NuGet
# restore; flatpak-builder has no network during the build). See packaging/README.md.
#
#   flatpak-builder --user --install --force-clean build-dir \
#     packaging/flatpak/io.github.theoriginalzads.UltimateLinuxDoomBuilder.yml
app-id: io.github.theoriginalzads.UltimateLinuxDoomBuilder
runtime: org.freedesktop.Platform
# 26.08, like upstream's flatpak/ manifest; 24.08 is past its end of life.
# The .NET 10 SDK extension is published for 24.08, 25.08 and 26.08.
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: uldb

finish-args:
  # ULDB uses Avalonia's X11 backend on purpose (XWayland on Wayland sessions), so this is
  # x11, not fallback-x11.
  - --socket=x11
  - --share=ipc
  # OpenGL for the 2D and 3D views.
  - --device=dri
  # Maps, resources (WADs, PK3s) and test engines usually live somewhere in home.
  - --filesystem=home
  # The program is framework-dependent; the .NET runtime is copied to /app/lib/dotnet.
  - --env=DOTNET_ROOT=/app/lib/dotnet
  - --env=DOTNET_CLI_TELEMETRY_OPTOUT=1

build-options:
  # The SDK first: install.sh (below) puts a runtime-only dotnet in /app, which can't build.
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_NOLOGO: '1'

modules:
  - name: uldb
    buildsystem: simple
    build-options:
      # Generic x86-64 code; a Flatpak is shared, so no CPU-specific tuning.
      env:
        ULDB_ARCH: generic
        ULDB_RID: linux-x64
        NUGET_PACKAGES: /run/build/uldb/nuget-packages
    build-commands:
      # Offline restore: the generated sources first, then the SDK's own packages.
      - ./packaging/build.sh --source ./nuget-sources --source /usr/lib/sdk/dotnet10/nuget/packages
      - PREFIX=/app ./packaging/install.sh
      # Copies the .NET 10 runtime into /app/lib/dotnet (after the build, which needs the SDK).
      - /usr/lib/sdk/dotnet10/bin/install.sh
    sources:
      # The checkout as it is, with its submodules (tools/compilers/src). A git source would build
      # the repository's default branch instead of what's checked out.
      # To build a published version, use instead:
      #   type: git, url: https://github.com/theoriginalzads/UltimateLinuxDoomBuilder.git, plus a tag or commit
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - nuget-restore
          - .restore-home
      # Generated by tools/flatpak/nuget-sources.py (packaging/README.md); not in git.
      - nuget-sources.json
