<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34323f"/>
      <stop offset="1" stop-color="#0c0b10"/>
    </linearGradient>
    <radialGradient id="body" cx="0.36" cy="0.30" r="0.75">
      <stop offset="0" stop-color="#f06a55"/>
      <stop offset="0.45" stop-color="#b8262a"/>
      <stop offset="0.85" stop-color="#6a0f14"/>
      <stop offset="1" stop-color="#3a0609"/>
    </radialGradient>
    <radialGradient id="mouth" cx="0.5" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#5a3aa0"/>
      <stop offset="0.6" stop-color="#2a1858"/>
      <stop offset="1" stop-color="#0e0820"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#b8ff7a"/>
      <stop offset="0.55" stop-color="#3cb83a"/>
      <stop offset="1" stop-color="#145a18"/>
    </radialGradient>
    <radialGradient id="sclera" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="1" stop-color="#c9b48a"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a7a66"/>
      <stop offset="1" stop-color="#f2ead8"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#bg)"/>

    <!-- Map editor lines and vertices behind the monster, like upstream's icon -->
    <g stroke-width="3" opacity="0.85">
      <path d="M-10 70 L120 20 L270 60" stroke="#d9c43c" fill="none"/>
      <path d="M200 -10 L232 150 L270 190" stroke="#d9c43c" fill="none"/>
      <path d="M-10 170 L40 120 L18 30" stroke="#c84646" fill="none"/>
      <path d="M232 150 L150 210" stroke="#c84646" fill="none"/>
    </g>
    <g fill="#e8e8e8">
      <rect x="116" y="16" width="8" height="8"/>
      <rect x="228" y="146" width="8" height="8"/>
      <rect x="36" y="116" width="8" height="8"/>
      <rect x="14" y="26" width="8" height="8"/>
    </g>

    <!-- Horns -->
    <path d="M80 62 C70 40 62 26 46 12 C70 22 90 36 102 52 Z" fill="url(#horn)" stroke="#3a2a1a" stroke-width="2"/>
    <path d="M176 62 C186 40 194 26 210 12 C186 22 166 36 154 52 Z" fill="url(#horn)" stroke="#3a2a1a" stroke-width="2"/>

    <!-- Body -->
    <circle cx="128" cy="116" r="80" fill="url(#body)" stroke="#2a0406" stroke-width="3"/>
    <g fill="#5e0c12" opacity="0.55">
      <ellipse cx="72" cy="104" rx="9" ry="6"/>
      <ellipse cx="186" cy="96" rx="8" ry="5"/>
      <ellipse cx="90" cy="70" rx="6" ry="4"/>
      <ellipse cx="170" cy="66" rx="7" ry="4"/>
      <ellipse cx="62" cy="140" rx="6" ry="9"/>
      <ellipse cx="196" cy="136" rx="6" ry="8"/>
    </g>

    <!-- Eye -->
    <path d="M94 88 Q128 58 162 88" fill="none" stroke="#4a080c" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="128" cy="96" rx="28" ry="22" fill="url(#sclera)" stroke="#3a0609" stroke-width="3"/>
    <circle cx="128" cy="97" r="15" fill="url(#iris)"/>
    <circle cx="128" cy="97" r="6.5" fill="#050505"/>
    <circle cx="122" cy="91" r="3.5" fill="#ffffff" opacity="0.9"/>

    <!-- Mouth -->
    <path d="M70 138 Q128 152 186 138 Q170 196 128 198 Q86 196 70 138 Z" fill="url(#mouth)" stroke="#2a0406" stroke-width="3"/>
    <g fill="#f4ecd6" stroke="#6b5a40" stroke-width="1">
      <path d="M78 141 L86 158 L92 143 Z"/>
      <path d="M94 144 L101 163 L108 146 Z"/>
      <path d="M110 147 L117 167 L124 148 Z"/>
      <path d="M132 148 L139 167 L146 147 Z"/>
      <path d="M148 146 L155 163 L162 144 Z"/>
      <path d="M164 143 L170 158 L178 141 Z"/>
      <path d="M100 188 L106 172 L113 192 Z"/>
      <path d="M118 194 L124 176 L130 196 Z"/>
      <path d="M134 195 L141 176 L147 192 Z"/>
      <path d="M150 190 L156 172 L161 186 Z"/>
    </g>

    <!-- Name band -->
    <rect y="196" width="256" height="60" fill="#000000" opacity="0.78"/>
    <text x="128" y="244" text-anchor="middle" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="50" fill="#ffffff" letter-spacing="2">ULDB</text>
  </g>
</svg>
