// ULDB: Linux version of upstream's Assets/Windows/Compilers/BCC/bcc.cfg.
// ULDB builds BCC from source (wormt/bcc) and ships BCC's own lib/ next to it, which
// BCC finds by itself. Scripts include "zcommon.h.bcs" (as with ZT-BCC); listing the
// library files lets UDB's include pre-check accept them.

compilers
{
	// This defines what files a compiler uses
	// The setting named "program" defines what .exe to run
	bcc
	{
		interface = "BccCompiler";
		program = "bcc";
		zcommon = "zcommon.bcs";
		zcommon_h = "zcommon.h.bcs";
	}
}
