// ULDB: Linux version of upstream's Assets/Windows/Compilers/ZT-BCC/zt-bcc.cfg.
// - program: the source-built Linux binary.
// - zcommon_h: zcommon.h.bcs is what ZT-BCC's documentation tells scripts to include.
//   Listing it lets UDB's include pre-check accept it; ZT-BCC finds it in lib/ itself.

compilers
{
	// This defines what files a compiler uses
	// The setting named "program" defines what .exe to run
	zt-bcc
	{
		interface = "ZtBccCompiler";
		program = "zt-bcc";
		zcommon = "zcommon.bcs";
		zcommon_h = "zcommon.h.bcs";
	}
}
